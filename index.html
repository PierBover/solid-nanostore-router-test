	<title>Document</title>
	<style>
		@keyframes fade-in {
			from {opacity: 0;}
			to {opacity: 1;}
		}

		.fade-in {
			animation-name: fade-in;
			animation-iteration-count: 1;
			animation-duration: .25s;
			animation-fill-mode: forwards;
		}

		.loading {
			opacity: .5;
		}
	</style>
</head>
